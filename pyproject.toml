[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiocraft"
version = "1.4.0a2"
description = "Audio generation research library for PyTorch"
readme = "README.md"
license = {text = "MIT License"}
authors = [
    {name = "FAIR Speech & Audio", email = "defossez@meta.com"}
]
maintainers = [
    {name = "FAIR Speech & Audio", email = "defossez@meta.com"}
]
keywords = ["audio", "generation", "pytorch", "music", "neural", "ai"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.9.0"
dependencies = [
    "av==11.0.0",
    "einops",
    "flashy>=0.0.1",
    "hydra-core>=1.1",
    "hydra_colorlog",
    "julius",
    "num2words",
    "numpy<2.0.0",
    "sentencepiece",
    "spacy>=3.7.0",
    "torch==2.1.0",
    "torchaudio==2.1.0",
    "huggingface_hub",
    "tqdm",
    "transformers>=4.31.0,<4.44.0",
    "xformers<0.0.23",
    "demucs",
    "librosa",
    "soundfile",
    "gradio",
    "torchmetrics",
    "encodec",
    "protobuf",
    "torchvision==0.16.0",
    "torchtext==0.16.0",
    "pesq",
    "pystoi",
    "torchdiffeq",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "flake8",
    "mypy",
    "pdoc3",
    "pytest",
    "pytest-cov",
    "black",
    "isort",
]
wm = [
    "audioseal",
]
all = [
    "audiocraft[dev,wm]",
]

[project.urls]
Homepage = "https://github.com/facebookresearch/audiocraft"
Documentation = "https://github.com/facebookresearch/audiocraft#readme"
Repository = "https://github.com/facebookresearch/audiocraft.git"
Issues = "https://github.com/facebookresearch/audiocraft/issues"

[project.scripts]
audiocraft = "audiocraft.train:main"

[tool.setuptools.packages.find]
include = ["audiocraft*"]

[tool.setuptools.package-data]
audiocraft = ["py.typed"]

[tool.setuptools]
include-package-data = true

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "av.*",
    "einops.*",
    "flashy.*",
    "hydra.*",
    "hydra_colorlog.*",
    "julius.*",
    "num2words.*",
    "sentencepiece.*",
    "spacy.*",
    "torch.*",
    "torchaudio.*",
    "torchvision.*",
    "torchtext.*",
    "huggingface_hub.*",
    "transformers.*",
    "xformers.*",
    "demucs.*",
    "librosa.*",
    "soundfile.*",
    "gradio.*",
    "torchmetrics.*",
    "encodec.*",
    "pesq.*",
    "pystoi.*",
    "torchdiffeq.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["audiocraft"]
omit = [
    "audiocraft/environment.py",
    "audiocraft/solvers/*",
    "audiocraft/utils/*",
    "audiocraft/*/loaders.py",
    "audiocraft/*/builders.py",
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".eggs",
    "*.egg-info",
]
per-file-ignores = [
    "__init__.py:F401",
    "tests/*:S101",
]

[tool.ruff]
target-version = "py38"
line-length = 120
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.ruff.isort]
known-first-party = ["audiocraft"]

# UV-specific configuration
[dependency-groups]
dev = [
    "coverage>=7.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pdoc3>=0.10.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[tool.uv.sources]
# Add any custom package sources here if needed

[tool.uv.extra-build-dependencies]
xformers = ["torch"]
spacy = ["Cython"]
